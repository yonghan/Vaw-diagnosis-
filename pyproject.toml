[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vwdiag"
version = "0.1.0"
description = "Open-source command-line diagnostics for VW Group vehicles (OBD-II / UDS over CAN, SocketCAN on Linux)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vwdiag = "vwdiag.cli:main"

[tool.setuptools]
packages = ["vwdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
